services:
  web:
    image: ${DOCKER_IMAGE:-insilicostrategy}:${DOCKER_TAG:-latest}
    environment:
      - HOST=0.0.0.0
      - PORT=4321
    ports:
      - "127.0.0.1:4321:4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s