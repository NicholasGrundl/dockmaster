name: CI -> kit-nanobot

on:
  push:
    branches: [main]
    paths:
      - "packages/kit-nanobot/**"
  pull_request:
    paths:
      - "packages/kit-nanobot/**"

defaults:
  run:
    working-directory: packages/kit-nanobot

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check nanobot/ tests/
      - run: uv run ruff format --check nanobot/ tests/
      - name: Type check (informational)
        run: uv run ty check nanobot/
        continue-on-error: true
      - run: uv run pytest -v
