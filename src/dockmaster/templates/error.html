{% extends "base.html" %}

{% block title %}{{ status_code }} — {{ ui.brand_name }}{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="flex items-center justify-center" style="min-height: 60vh;">
    <div class="text-center max-w-md">
        <p class="text-6xl font-bold mb-4" style="color: var(--color-primary);">{{ status_code }}</p>
        <h1 class="text-xl font-semibold mb-2">{{ message }}</h1>
        {% if detail %}
        <p class="text-sm mb-6" style="color: #6b7280;">{{ detail }}</p>
        {% endif %}
        <a href="/ui/"
           class="inline-block px-5 py-2.5 rounded-md text-sm font-medium text-white no-underline"
           style="background-color: var(--color-primary);"
           onmouseover="this.style.opacity='0.9'"
           onmouseout="this.style.opacity='1'">
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
